; PlatformIO Project Configuration File
; LoveTV direct port for 星智 1.54TFT WiFi 版 (ESP32-S3 N16R8)
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32s3]
platform = espressif32
board = xingzhi-esp32s3-n16r8
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = dio
; 星智板 Flash 只支持 DIO（小智固件实测 DIO+80MHz+16MB），PSRAM 为 8MB Octal
board_build.arduino.memory_type = dio_opi
board_build.partitions = partition.csv
extra_scripts = post:scripts/merge_and_upload.py
upload_speed = 115200
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	; TFT_eSPI user setup for 星智 ST7789 240x240 (no library edits)
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=240
	-DTFT_MISO=-1
	-DTFT_MOSI=10
	-DTFT_SCLK=9
	-DTFT_CS=14
	-DTFT_DC=8
	-DTFT_RST=18
	-DTFT_BL=13
	; ESP32-S3 HSPI maps to SPI3_HOST, matching the verified xiaozhi driver.
	-DUSE_HSPI_PORT=1
	; 对齐小智 esp_lcd 驱动（已验证）：SPI 模式 3、80MHz
	-DTFT_SPI_MODE=SPI_MODE3
	-DSPI_FREQUENCY=80000000
	-DSPI_READ_FREQUENCY=10000000
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
	lennarthennigs/Button2@^2.2.4
	ivanseidel/ArduinoThread@^2.1.1
	paulstoffregen/Time@^1.6.1
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TJpg_Decoder@^1.0.8
	links2004/WebSockets@^2.4.3
